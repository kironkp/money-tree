<div class="card feed-card" data-feed-url="{% url 'api-feed' %}?{{ account.query }}" data-feed-interval="2000">
  <h3>Live feed — {{ account.label }}
    <span class="more"><a href="{% url 'feed' %}?{{ account.query }}">full page</a></span></h3>
  <div class="chips">
    <button type="button" class="btn small active" data-levels="">all</button>
    <button type="button" class="btn small" data-levels="signal,order,fill,trade,risk,error,journal">decisions</button>
    <button type="button" class="btn small" data-levels="fill,trade">trades</button>
    <button type="button" class="btn small" data-levels="bar">thoughts</button>
    <button type="button" class="btn small" data-levels="system,risk,error,journal">system</button>
    <span style="margin-left:auto"></span>
    <button type="button" class="btn small" data-pause>❚❚ pause</button>
    <button type="button" class="btn small" data-jump>↓ latest</button>
  </div>
  <div class="feed {{ feed_class|default:'' }}"></div>
</div>
