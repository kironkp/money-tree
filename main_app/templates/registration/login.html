{% extends 'base.html' %}
{% block title %}Log in · MoneyTree{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="card">
    <div class="brand-big"><span class="leaf">🌳</span> MoneyTree</div>
    <p class="muted">Seed capital, real quotes, real discipline.</p>
    {% if form.errors %}<p class="message error">Wrong username or password.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field"><label for="id_username">Username</label><input type="text" name="username" id="id_username" autofocus autocomplete="username" required></div>
      <div class="field"><label for="id_password">Password</label><input type="password" name="password" id="id_password" autocomplete="current-password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn primary">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
