{% load mt_tags %}
<div class="tabs">
  <a href="{% url 'trades' %}?{{ account.query }}" class="{% if request.resolver_match.url_name == 'trades' %}active{% endif %}">Trades</a>
  <a href="{% url 'positions' %}?{{ account.query }}" class="{% if request.resolver_match.url_name == 'positions' %}active{% endif %}">Positions</a>
  <a href="{% url 'orders' %}?{{ account.query }}" class="{% if request.resolver_match.url_name == 'orders' %}active{% endif %}">Orders</a>
  <a href="{% url 'signals' %}?{{ account.query }}" class="{% if request.resolver_match.url_name == 'signals' %}active{% endif %}">Signals</a>
  <a href="{% url 'risk-events' %}?{{ account.query }}" class="{% if request.resolver_match.url_name == 'risk-events' %}active{% endif %}">Risk events</a>
  <span class="small muted" style="align-self:center">account: <strong>{{ account.label }}</strong>
    · <a href="?account={{ account.mode }}&market=stocks">stocks</a> · <a href="?account={{ account.mode }}&market=crypto">crypto</a>
    · <a href="?account=replay&market={{ account.market }}">replay</a>{% if account.mode != 'sim' %} · <a href="?account=sim&market={{ account.market }}">sim</a>{% endif %}</span>
</div>
